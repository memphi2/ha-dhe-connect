version: 2
#
# Note on the Repository checks gate: scripts/check_integration.py keeps its own
# allow-list of approved action SHAs (VALIDATION_ACTION_PINS) and of exact
# dependency pins (VALIDATION_DEPENDENCY_MINIMUMS), and fails on anything that
# does not match. That duplication is the point -- it stops a pin from moving
# unnoticed -- but it also means a Dependabot pull request is red until the table
# is updated in the same commit. Dependabot is the notification here, not the
# merge button: take the bump, then carry the new SHA or pin into the guard.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "pip"
    directory: "/"
    # requirements.txt is the only pin set: the workflow installs from it
    # directly, without a Home Assistant constraints file. A bump therefore
    # lands in CI exactly as written here.
    schedule:
      interval: "monthly"
      time: "05:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    groups:
      python-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
    ignore:
      # Python majors are compatibility work, not routine maintenance.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # These two are one pair: pytest-homeassistant-custom-component builds its
      # fixtures against a specific core release. Bumping either alone breaks the
      # test harness, so both move by hand after the next-ha job has proven it.
      #
      # Spelled as update-types rather than versions: ">=0" on purpose. A bare
      # version range is ignored on the security path too, which would hide a
      # Home Assistant advisory; naming the version-update types keeps routine
      # bumps out while leaving security updates free to open a pull request.
      - dependency-name: "homeassistant"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "pytest-homeassistant-custom-component"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
