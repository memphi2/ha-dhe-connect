version: 2
#
# scripts/check_integration.py validates the action names, full-length SHA pins,
# consistent refs, and supported release comments directly from the workflow.
# Dependabot can therefore update action pins without a duplicated SHA table.
# Python tool floors may increase inside the reviewed version bounds.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "pip"
    directory: "/"
    # requirements.txt is the only pin set: the workflow installs from it
    # directly, without a Home Assistant constraints file. A bump therefore
    # lands in CI exactly as written here.
    schedule:
      interval: "monthly"
      time: "05:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    groups:
      python-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
    ignore:
      # Python majors are compatibility work, not routine maintenance.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Core and the official pytest-home-assistant helpers move together in
      # requirements-ha.txt after validation against the matching core revision.
      #
      # Spelled as update-types rather than versions: ">=0" on purpose. A bare
      # version range is ignored on the security path too, which would hide a
      # Home Assistant advisory; naming the version-update types keeps routine
      # bumps out while leaving security updates free to open a pull request.
      - dependency-name: "homeassistant"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "pytest-home-assistant"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # HA runtime dependencies and pytest are transitive, not independent pins.
