version: 2
#
# scripts/check_integration.py validates the action names, full-length SHA pins,
# consistent refs, and supported release comments directly from the workflow.
# Dependabot can therefore update action pins without a duplicated SHA table.
# Exact Python dependency floors remain guarded separately.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "pip"
    directory: "/"
    # requirements.txt is the only pin set: the workflow installs from it
    # directly, without a Home Assistant constraints file. A bump therefore
    # lands in CI exactly as written here.
    schedule:
      interval: "monthly"
      time: "05:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    groups:
      python-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
    ignore:
      # Python majors are compatibility work, not routine maintenance.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # These two are one pair: pytest-homeassistant-custom-component builds its
      # fixtures against a specific core release. Bumping either alone breaks the
      # test harness, so both move by hand after the next-ha job has proven it.
      #
      # Spelled as update-types rather than versions: ">=0" on purpose. A bare
      # version range is ignored on the security path too, which would hide a
      # Home Assistant advisory; naming the version-update types keeps routine
      # bumps out while leaving security updates free to open a pull request.
      - dependency-name: "homeassistant"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "pytest-homeassistant-custom-component"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # The four below are not a free choice: the pinned Home Assistant and
      # its test fixture require exact versions of them, so a bump of any one
      # cannot be installed at all -- pip answers ResolutionImpossible before
      # a gate runs. They move when their dictating package moves, which is an
      # entry above.
      #   pytest==9.0.3, pytest-cov==7.1.0  <- pytest-homeassistant-custom-component 0.13.372
      #   aiohttp==3.14.4, zeroconf==0.151.5 <- homeassistant 2026.10.1
      - dependency-name: "pytest"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "pytest-cov"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "aiohttp"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "zeroconf"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
